apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: veo-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/finn-e/testkube-samples.git
    targetRevision: HEAD
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-ingress
  namespace: argocd
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: argocd.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: testkube-ingress
  namespace: testkube
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: testkube.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: testkube-dashboard
                port:
                  number: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: testkube-mongodb
  namespace: testkube
spec:
  replicas: 1
  selector:
    matchLabels:
      app: testkube-mongodb
  template:
    metadata:
      labels:
        app: testkube-mongodb
    spec:
      containers:
        - name: mongodb
          image: mongo:4.4
          ports:
            - containerPort: 27017
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "100m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: testkube-mongodb
  namespace: testkube
spec:
  ports:
    - port: 27017
      targetPort: 27017
  selector:
    app: testkube-mongodb
